# Optional Kubernetes (Minikube) Deployment File
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-demo-app
  template:
    metadata:
      labels:
        app: cicd-demo-app
    spec:
      containers:
        - name: cicd-demo-app
          image: vaishnaviiwarad/cicd-demo-app:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo-service
spec:
  type: NodePort
  selector:
    app: cicd-demo-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
